name: TEMP AVGO official IR earnings originals

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-avgo-earnings-relay.yml

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Broadcom official IR PDFs
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, time
          from pathlib import Path
          import requests

          records = [
            (2021,1,54341),(2021,2,54666),(2021,3,58521),(2021,4,59786),
            (2022,1,59981),(2022,2,60276),(2022,3,60481),(2022,4,60766),
            (2023,1,60981),(2023,2,61211),(2023,3,61371),(2023,4,61576),
            (2024,1,61901),(2024,2,62226),(2024,3,62441),(2024,4,62701),
            (2025,1,62921),(2025,2,63151),(2025,3,63416),(2025,4,63716),
            (2026,1,63976),(2026,2,64371),(2026,3,64671),
          ]
          out = Path("avgo_official_ir")
          out.mkdir(exist_ok=True)
          session = requests.Session()
          session.headers.update({
            "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36",
            "Accept": "application/pdf,text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
            "Accept-Language": "en-US,en;q=0.9",
            "Referer": "https://investors.broadcom.com/",
            "Cache-Control": "no-cache",
          })
          manifest=[]
          for fy,q,node in records:
            url=f"https://investors.broadcom.com/node/{node}/pdf"
            r=session.get(url,timeout=45,allow_redirects=True)
            print(f"FY{fy} Q{q}: {r.status_code} {len(r.content)} {r.headers.get('content-type')} final={r.url}")
            r.raise_for_status()
            raw=r.content
            if not raw.startswith(b"%PDF-"):
              raise SystemExit(f"NOT_PDF FY{fy}Q{q}: {raw[:80]!r}")
            if len(raw)<10000:
              raise SystemExit(f"TOO_SMALL FY{fy}Q{q}: {len(raw)}")
            fn=f"AVGO_FY{fy}_Q{q}_Earnings_Release_Official_IR.pdf"
            (out/fn).write_bytes(raw)
            manifest.append({
              "fy":fy,"quarter":q,"node":node,"source_url":url,
              "filename":fn,"bytes":len(raw),"sha256":hashlib.sha256(raw).hexdigest()
            })
            time.sleep(0.2)
          if len(manifest)!=23:
            raise SystemExit(f"COUNT_FAIL {len(manifest)}")
          (out/"manifest.json").write_text(json.dumps({
            "ticker":"AVGO","company":"Broadcom Inc.","source":"Broadcom official IR PDF",
            "count":23,"quarters":manifest
          },indent=2),encoding="utf-8")
          print(json.dumps({"status":"PASS","count":23}))
          PY

      - name: Upload byte-preserving artifact
        uses: actions/upload-artifact@v4
        with:
          name: avgo-official-ir-fy2021q1-fy2026q3
          path: avgo_official_ir/
          if-no-files-found: error
          retention-days: 2
